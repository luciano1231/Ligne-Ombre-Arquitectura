<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | Ligne & Ombre Studio</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .tab-btn {
      padding: 12px 24px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--clr-text-muted);
      border-bottom: 3px solid transparent;
      transition: all var(--transition-fast);
      outline: none;
    }
    .tab-btn:hover {
      color: var(--clr-forest-dark);
    }
    .tab-btn.active {
      color: var(--clr-forest-dark);
      font-weight: 500;
      border-bottom-color: var(--clr-gold);
    }
    .admin-tab-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      border-bottom: 2px solid rgba(38,62,43,.08);
      flex-wrap: wrap;
    }
    .admin-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .preview-img-wrap {
      position: relative;
      padding-top: 75%;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .preview-img-wrap img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .preview-img-wrap .btn-remove-img {
      position: absolute;
      top: 4px; right: 4px;
      background: rgba(192,57,43,0.85);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 20px; height: 20px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .preview-img-wrap .btn-remove-img:hover {
      background: #c0392b;
    }
  </style>
</head>
<body class="admin-body">

  <!-- PANTALLA DE LOGIN -->
  <div id="loginScreen" class="admin-login">
    <div class="admin-login__box">
      <img src="assets/logo.svg" alt="Logo" class="admin-login__logo">
      <h1 class="admin-login__title">Panel de Administración</h1>
      <p class="admin-login__sub">Ligne & Ombre Studio</p>
      <div class="admin-field">
        <label class="admin-label">Contraseña</label>
        <input type="password" id="pwInput" class="admin-input" placeholder="••••••••" onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <button class="btn btn--primary admin-login__btn" onclick="doLogin()">Ingresar</button>
      <p id="loginError" class="admin-error" style="display:none">Contraseña incorrecta</p>
    </div>
  </div>

  <!-- PANEL PRINCIPAL -->
  <div id="adminPanel" style="display:none">
    <header class="admin-header">
      <div class="admin-header__inner">
        <a href="index.html" class="admin-header__logo">
          <img src="assets/logo.svg" alt="Logo" style="height:48px">
        </a>
        <h2 class="admin-header__title">Panel de Control General</h2>
        <div class="admin-header__actions">
          <a href="index.html" class="btn btn--outline-dark" style="font-size:.74rem;padding:10px 20px">Ir al Sitio</a>
          <button class="btn btn--outline-dark" onclick="doLogout()" style="font-size:.74rem;padding:10px 20px">Cerrar sesión</button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-container">

        <!-- Selector de Pestañas -->
        <div class="admin-tab-selector">
          <button class="tab-btn active" id="tab-arquitectura" onclick="switchTab('arquitectura')">Proyectos de Arquitectura</button>
          <button class="tab-btn" id="tab-interiores" onclick="switchTab('interiores')">Proyectos de Interiores</button>
          <button class="tab-btn" id="tab-catalogo" onclick="switchTab('catalogo')">Catálogo de Muebles</button>
        </div>

        <!-- FORMULARIO -->
        <section class="admin-card">
          <h3 class="admin-card__title" id="formTitle">Agregar Proyecto</h3>
          <input type="hidden" id="editId">
          
          <div class="admin-grid-2">
            
            <!-- Campo Título/Nombre -->
            <div class="admin-field">
              <label class="admin-label" id="lblTitle">Título del proyecto *</label>
              <input type="text" id="pTitle" class="admin-input" placeholder="Nombre descriptivo">
            </div>

            <!-- Campo Ubicación (Arquitectura e Interiores) -->
            <div class="admin-field" id="field-location">
              <label class="admin-label">Ubicación</label>
              <input type="text" id="pLocation" class="admin-input" placeholder="Ej: Corrientes, Argentina">
            </div>

            <!-- Campo Categoría Mueble (Catálogo) -->
            <div class="admin-field" id="field-category" style="display:none">
              <label class="admin-label">Categoría *</label>
              <select id="pCat" class="admin-input">
                <!-- Se rellena dinámicamente -->
              </select>
            </div>

            <!-- Campo Año (Arquitectura e Interiores) -->
            <div class="admin-field" id="field-year">
              <label class="admin-label">Año</label>
              <input type="text" id="pYear" class="admin-input" placeholder="Ej: 2024">
            </div>

            <!-- Campo Material (Catálogo) -->
            <div class="admin-field" id="field-material" style="display:none">
              <label class="admin-label">Material</label>
              <input type="text" id="pMaterial" class="admin-input" placeholder="Ej: Madera maciza de paraíso">
            </div>

            <!-- Campo Imágenes -->
            <div class="admin-field">
              <label class="admin-label" id="lblImages">Imágenes (Subir una o varias) *</label>
              <input type="file" id="pImgFiles" class="admin-input" accept="image/*" multiple onchange="handleImageUpload(this)">
              <input type="text" id="pImgUrls" class="admin-input" placeholder="O pegar URLs de imágenes separadas por comas" style="margin-top:8px">
            </div>

          </div>

          <!-- Descripción -->
          <div class="admin-field">
            <label class="admin-label">Descripción</label>
            <textarea id="pDesc" class="admin-input admin-textarea" placeholder="Escribe detalles del proyecto o mueble..."></textarea>
          </div>

          <!-- Previsualización de imágenes -->
          <div id="pPreviewContainer" class="admin-img-preview" style="display:none">
            <label class="admin-label">Previsualización de imágenes:</label>
            <div id="pPreviewGrid" class="admin-preview-grid"></div>
          </div>

          <div class="admin-form-actions">
            <button class="btn btn--primary" id="btnSubmit" onclick="saveCurrentItem()">Guardar</button>
            <button class="btn btn--outline-dark" onclick="resetForm()" id="cancelBtn" style="display:none">Cancelar edición</button>
          </div>
          <p id="formMsg" class="admin-msg" style="display:none"></p>
        </section>

        <!-- GESTIÓN DE CATEGORÍAS -->
        <section class="admin-card" id="categoriesSection" style="display:none; margin-top:32px;">
          <h3 class="admin-card__title">Gestionar Categorías del Catálogo</h3>
          <input type="hidden" id="editCatId">
          <div class="admin-field" style="margin-bottom: 12px;">
            <label class="admin-label">Nombre de la Categoría *</label>
            <div style="display:flex; gap:8px;">
              <input type="text" id="catInput" class="admin-input" placeholder="Ej: Sillones, Estanterías" style="flex:1">
              <button class="btn btn--primary" id="btnSaveCat" onclick="saveCategory()" style="padding:12px 24px">Guardar</button>
              <button class="btn btn--outline-dark" id="cancelCatBtn" onclick="resetCatForm()" style="display:none; padding:12px 20px">✕</button>
            </div>
          </div>
          <p id="catMsg" class="admin-msg" style="display:none"></p>
          <div id="categoryList" class="admin-list" style="margin-top:16px"></div>
        </section>

        <!-- LISTADO -->
        <section class="admin-card">
          <div class="admin-card__header">
            <h3 class="admin-card__title" id="listTitle">Proyectos Cargados</h3>
            <span id="countBadge" class="admin-badge">0</span>
          </div>
          <div id="itemList" class="admin-list"></div>
        </section>

      </div>
    </main>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
